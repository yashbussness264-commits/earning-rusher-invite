<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earning Rusher - Invite</title>
<style>
:root{--bg:#0F0B22;--card:#1A1436;--line:#33295F;--gold:#FFC933;--vio:#7C5CFF;--txt:#F3F0FF;--mut:#9C93C9}
*{box-sizing:border-box;margin:0;padding:0}body{background:radial-gradient(circle at 50% 0,#3A2A8C,var(--bg) 60%);color:var(--txt);font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{max-width:420px;width:100%;text-align:center}.logo{width:90px;height:90px;margin-bottom:10px}
h1{font-size:28px;margin-bottom:6px}p{color:var(--mut);margin-bottom:16px}
.code{background:var(--card);border:1px dashed var(--gold);border-radius:16px;padding:16px;margin:16px 0}
.code b{display:block;font-size:30px;color:var(--gold);letter-spacing:2px;margin-top:6px}
a.btn,button{display:block;width:100%;padding:15px;border-radius:14px;border:0;font:inherit;font-weight:800;text-decoration:none;margin-bottom:10px;cursor:pointer}

</style></head><body><div class="box">
<svg class="logo" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#FFC933"/><path d="M54 20 30 55h16l-4 25 28-38H54z" fill="#2B1B00"/></svg>
<h1>Earning Rusher</h1>
<p id="msg">Tasks karo, videos dekho aur real paise kamao!</p>
<div class="code" id="codeBox" style="display:none"><span style="color:var(--mut)">Aapka referral code</span><b id="code"></b></div>

</div>
<script>
